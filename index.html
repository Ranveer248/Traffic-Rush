<style>
/* Layout: a full-screen 3D world with Cargo Run's chunky navy panels floating over it; menus slide in as cards. */
:root {
  --night: #0b0e1c;
  --panel: rgba(18, 22, 40, 0.86);
  --panel2: #232a4a;
  --edge: #070912;
  --ink: #f1ecd9;
  --dim: #b4b0a2;
  --accent: #ffc21a;
  --good: #3ddc97;
  --bad: #ff5d5d;
  --cyan: #37e4f0;
  --exit: #1f7a4d;
  --disp: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--body); }
#app { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#gl { display: block; width: 100%; height: 100%; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.pnl { background: var(--panel); border: 2.5px solid var(--edge); border-radius: 14px; box-shadow: 0 3px 0 rgba(7, 9, 18, 0.9); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hTop { position: absolute; left: 14px; top: calc(env(safe-area-inset-top, 0px) + 12px); width: min(232px, 44vw); display: flex; flex-direction: column; gap: 8px; }
#pMain { padding: 9px 12px 10px; }
#hCash { display: block; font: 30px/1 var(--disp); font-variant-numeric: tabular-nums; }
#hCash em { font-style: normal; font-size: 18px; color: var(--good); margin-left: 6px; }
#hSub { display: block; margin-top: 3px; font-size: 13px; font-weight: 800; color: var(--dim); font-variant-numeric: tabular-nums; }
.bar { height: 9px; border-radius: 5px; background: rgba(255, 255, 255, 0.12); overflow: hidden; margin-top: 7px; }
.bar i { display: block; height: 100%; width: 50%; border-radius: 5px; background: var(--good); }
.bar.y i { background: var(--accent); } .bar.r i { background: var(--bad); } .bar.c i { background: var(--cyan); }
#pJob { padding: 8px 12px 10px; }
.lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 900; letter-spacing: 0.06em; color: var(--dim); }
.lbl em { font-style: normal; color: var(--accent); letter-spacing: 0.04em; }
.lbl em.hot { animation: siren 0.5s steps(1) infinite; }
@keyframes siren { 0% { color: #ff3b3b; } 50% { color: #3d7bff; } }
#hName { display: block; margin-top: 3px; font: 17px/1.15 var(--disp); overflow-wrap: anywhere; }
.row { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 12px; font-weight: 800; color: var(--dim); }
#hPay { color: var(--good); font: 15px var(--disp); }
#hRight { position: absolute; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.ibtn { pointer-events: auto; width: 46px; height: 46px; border-radius: 14px; border: 2.5px solid var(--edge); background: var(--panel); font: 17px var(--disp); box-shadow: 0 3px 0 var(--edge); display: grid; place-items: center; }
.ibtn svg { width: 22px; height: 22px; }
#hBtns { display: flex; gap: 8px; }
#hLives { display: flex; gap: 4px; padding: 8px 10px; }
#hLives i { width: 10px; height: 20px; border-radius: 4px; background: var(--accent); }
#hLives i.off { background: rgba(255, 255, 255, 0.18); }
#chips { display: flex; gap: 6px; }
.chip { font: 13px var(--disp); padding: 5px 9px; border-radius: 999px; background: var(--panel); border: 2px solid var(--edge); }
#banner { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translateX(-50%); max-width: calc(100% - 40px); text-align: center; padding: 9px 16px; border-radius: 12px; border: 2px solid var(--ink); font: 17px/1.2 var(--disp); color: #fff; background: rgba(31, 122, 77, 0.95); }
#banner.escape { background: rgba(165, 30, 42, 0.95); }
#banner.blink { animation: blink 0.5s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0.6; } }
#bigMsg { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); font: clamp(34px, 9vw, 64px)/1 var(--disp); color: #fff; text-shadow: 0 4px 0 var(--edge), 0 0 24px rgba(0, 0, 0, 0.5); white-space: nowrap; }
#toast { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); transform: translateX(-50%); max-width: calc(100% - 32px); text-align: center; padding: 10px 16px; border-radius: 12px; background: var(--panel); border: 2px solid var(--edge); font-weight: 800; font-size: 15px; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
#toast.on { opacity: 1; }
#speedo { position: absolute; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 132px; height: 132px; }
#speedo svg { width: 100%; height: 100%; }
#padRow { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; justify-content: space-between; align-items: flex-end; padding: 0 14px; pointer-events: none; }
#padRow button { pointer-events: auto; width: 76px; height: 76px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, 0.28); background: rgba(8, 10, 16, 0.45); font: 40px/1 var(--disp); }
#actBtn { width: 66px !important; height: 66px !important; font: 12px var(--disp) !important; color: #9be7ff; }
.pop { position: absolute; transform: translate(-50%, -50%); font: 21px var(--disp); white-space: nowrap; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.6); pointer-events: none; }
#fade { position: absolute; inset: 0; background: #070912; opacity: 0; pointer-events: none; }
#vignette { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.25s; box-shadow: inset 0 0 140px rgba(55, 228, 240, 0.55); }
#hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 160px rgba(255, 40, 40, 0.7); }
#fps { position: absolute; left: 14px; bottom: 8px; font: 12px var(--body); font-weight: 800; color: #9be7ff; }

/* phones held upright: thin strips instead of tall panels */
@media (max-width: 560px) {
  #hTop { left: 8px; right: 66px; width: auto; gap: 6px; }
  #pMain { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 10px; padding: 6px 10px; }
  #hCash { font-size: 21px; } #hCash em { font-size: 13px; }
  #hSub { grid-column: 1; font-size: 10.5px; margin-top: 1px; }
  #pMain .bar { grid-column: 2; grid-row: 1 / span 2; margin: 0; height: 8px; }
  #pJob { padding: 6px 10px; }
  #hName { font-size: 14px; }
  .row { margin-top: 3px; font-size: 11px; }
  #hRight { right: 8px; }
  #hBtns { flex-direction: column; }
  #hLives { padding: 5px 7px; } #hLives i { width: 7px; height: 14px; }
  #banner { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); font-size: 15px; }
  #speedo { width: 96px; height: 96px; right: 50%; transform: translateX(50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); }
}
@media (hover: hover) and (pointer: fine) { #padL, #padR { visibility: hidden; } }

/* ---------- screens ---------- */
.ov { position: absolute; inset: 0; display: flex; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.ov.dim { background: radial-gradient(ellipse at 50% 35%, rgba(11, 14, 28, 0.15), rgba(11, 14, 28, 0.75)); }
.card { margin: auto; width: min(480px, 100%); background: var(--panel); border: 3px solid var(--edge); border-radius: 22px; box-shadow: 0 6px 0 var(--edge); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card.wide { width: min(860px, 100%); }
.center { text-align: center; }
.logo { font: clamp(42px, 10vw, 68px)/0.95 var(--disp); color: #fff; text-shadow: 0 4px 0 var(--edge); text-align: center; }
.logo b { font-weight: 400; display: inline-block; background: var(--accent); color: #2a1100; padding: 0 12px 4px; border-radius: 12px; border: 3px solid var(--edge); text-shadow: none; transform: rotate(-2deg); }
.logo em { font-style: normal; display: inline-block; margin-left: 6px; color: var(--cyan); }
.tag { margin: -4px 0 0; font-weight: 800; color: var(--dim); font-size: 14px; text-align: center; }
.btn { border: 3px solid var(--edge); border-radius: 16px; background: var(--accent); color: #2a1100; font: 26px var(--disp); padding: 11px 18px; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18), 0 4px 0 var(--edge); }
.btn:active { transform: translateY(3px); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 1px 0 var(--edge); }
.btn.sm { font-size: 17px; padding: 7px 13px; border-radius: 12px; }
.btn.ghost { background: var(--panel2); color: var(--ink); font-size: 19px; }
.btn.blue { background: #3d7bff; color: #fff; } .btn.navy { background: #24408f; color: #fff; } .btn.green { background: #22c46f; color: #fff; } .btn.grey { background: #5b6380; color: #fff; }
.btn:disabled { opacity: 0.45; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > * { min-width: 0; }
.mbtn { display: flex; align-items: center; gap: 9px; font-size: 19px; padding: 9px 11px; text-align: left; }
.mbtn svg { width: 30px; height: 30px; flex-shrink: 0; padding: 3px; border-radius: 9px; background: rgba(255, 255, 255, 0.2); }
.mbtn span { display: flex; flex-direction: column; min-width: 0; }
.mbtn small { font: 12px/1.2 var(--body); font-weight: 800; opacity: 0.85; overflow-wrap: anywhere; }
.hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hd h2 { margin: 0; font: 28px var(--disp); }
.chips2 { display: flex; gap: 7px; flex-wrap: wrap; }
.chips2 button { font: 15px var(--disp); padding: 6px 13px; border-radius: 999px; border: 3px solid var(--edge); background: var(--panel2); }
.chips2 button.on { background: var(--accent); color: #2a1100; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.pc { text-align: left; border: 3px solid var(--edge); border-radius: 16px; background: #171c33; box-shadow: 0 4px 0 var(--edge); padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.pc.on { border-color: var(--accent); box-shadow: 0 4px 0 #a8770a; }
.pc .art { height: 84px; position: relative; }
.pc .art svg { width: 100%; height: 100%; display: block; }
.pc .tx { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
.pc small { font-size: 11px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.pc b { font: 17px/1.15 var(--disp); color: #fff; }
.pc span { font-size: 12px; font-weight: 700; color: var(--dim); line-height: 1.3; }
.sb { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--dim); }
.sb i { height: 7px; border-radius: 4px; background: #0e1224; overflow: hidden; } .sb u { display: block; height: 100%; background: var(--accent); }
.it { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
.it b { font-weight: 800; }
.segs { display: flex; gap: 6px; flex-wrap: wrap; }
.segs button { padding: 6px 11px; border-radius: 10px; border: 2px solid var(--edge); background: var(--panel2); font-weight: 800; font-size: 14px; }
.segs button.on { background: var(--accent); color: #2a1100; }
.it.col { flex-direction: column; align-items: stretch; gap: 7px; }
.it .hint { font-size: 12px; font-weight: 700; color: var(--dim); }
.sect { font: 15px var(--disp); color: var(--accent); letter-spacing: 0.04em; margin: 4px 0 -4px; }
.bank { display: inline-block; font: 18px var(--disp); color: #3ddc97; padding: 5px 12px; border: 2.5px solid #2fae6a; border-radius: 12px; background: #07140e; }
.mult { color: #3ddc97 !important; }

/* garage: the car turns on a lit platform up top; everything you change sits in a sheet underneath */
#screen.gar * { box-sizing: border-box; }
#screen.gar { padding: 0; display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(ellipse at 50% 28%, rgba(255, 240, 200, 0.10), rgba(8, 10, 18, 0) 45%), linear-gradient(rgba(8, 10, 18, 0.35), rgba(8, 10, 18, 0) 30%); }
.gtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px 0; }
.gname { background: rgba(7, 9, 18, 0.88); border-radius: 12px; padding: 8px 14px; font: 21px/1.1 var(--disp); color: #fff; }
.gname small { display: block; font: 11px var(--body); font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-top: 3px; }
.gstage { flex: 1; min-height: 120px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
.gstage button { width: 52px; height: 52px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, 0.3); background: rgba(8, 10, 16, 0.5); font: 30px/1 var(--disp); color: #9be7ff; }
.gsheet { width: min(600px, 100%); margin: 0 auto; background: #12162a; border: 3px solid var(--edge); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; flex-direction: column; gap: 11px; max-height: 50vh; overflow-y: auto; }
.gcars { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.gcars button { flex: 0 0 auto; padding: 6px 10px; border-radius: 11px; border: 2.5px solid var(--edge); background: var(--panel2); font-weight: 800; font-size: 13px; line-height: 1.15; text-align: left; }
.gcars button em { display: block; font-style: normal; font-size: 11px; color: var(--accent); } .gcars button.own em { color: #3ddc97; }
.gcars button.on { background: #3d7bff; color: #fff; } .gcars button.on em { color: #fff; }
.gtabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.gtabs button { font: 15px var(--disp); padding: 8px 4px; border-radius: 12px; border: 2.5px solid var(--edge); background: var(--panel2); }
.gtabs button.on { background: #3d7bff; color: #fff; }
.gstats { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.gbar { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; margin: 3px 0; }
.gbar i { height: 12px; border-radius: 7px; background: #2a3150; overflow: hidden; position: relative; } .gbar u { position: absolute; inset: 0 auto 0 0; background: #6cd0ff; border-radius: 7px; } .gbar u.up { background: #3ddc97; }
.sw { display: grid; grid-template-columns: repeat(7, minmax(0, 40px)); justify-content: center; gap: 9px; }
.sw button { aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--edge); box-shadow: 0 0 0 0 #fff; }
.sw button.on { box-shadow: 0 0 0 3px #fff; }
.opt { display: flex; gap: 6px; flex-wrap: wrap; }
.opt button { padding: 7px 10px; border-radius: 11px; border: 2.5px solid var(--edge); background: var(--panel2); font-weight: 800; font-size: 13px; line-height: 1.15; text-align: center; }
.opt button em { display: block; font-style: normal; font-size: 11px; color: #3ddc97; } .opt button em.no { color: #ff7a7a; }
.opt button.on { background: var(--accent); color: #2a1100; } .opt button.on em { color: #2a1100; }
.upg { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
.upg b { font-weight: 900; } .upg span { font-size: 12px; color: var(--dim); font-weight: 700; }
.pips { display: flex; gap: 4px; margin-top: 3px; } .pips i { width: 18px; height: 6px; border-radius: 3px; background: #2a3150; } .pips i.on { background: #3ddc97; }
.big2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big2 div, .mini div { background: rgba(0, 0, 0, 0.25); border-radius: 12px; padding: 10px 6px; text-align: center; }
.big2 b { display: block; font: 26px var(--disp); color: var(--good); }
.mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mini b { display: block; font: 20px var(--disp); }
.big2 span, .mini span { font-size: 12px; color: var(--dim); font-weight: 800; }
h1.ttl { margin: 0; font: 34px/1.05 var(--disp); text-wrap: balance; text-align: center; }
.note { font-size: 12px; color: var(--dim); margin: 0; font-weight: 700; text-align: center; }
.keys kbd { font: 12px var(--body); font-weight: 900; padding: 1px 6px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--edge); }
.job { display: flex; align-items: center; gap: 12px; padding: 10px; border: 3px solid var(--edge); border-radius: 14px; background: #171c33; }
.job.lock { opacity: 0.5; }
.job .jtx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.job .jtx b { font: 17px var(--disp); } .job .jtx span { font-size: 12px; color: var(--dim); font-weight: 700; }
.job .stars { color: var(--accent); font-size: 14px; letter-spacing: 0.06em; }
.job em { font-style: normal; font: 20px var(--disp); color: var(--good); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--night); font: 22px var(--disp); }
@media (max-height: 560px) { .card { gap: 9px; padding: 14px 16px; } .logo { font-size: 40px; } }
@media (max-width: 420px) { .cards { grid-template-columns: 1fr 1fr; } .pc .art { height: 70px; } .pc b { font-size: 15px; } }
@media (prefers-reduced-motion: reduce) { #banner.blink, .lbl em.hot { animation: none; } }
</style>

/* ---------- auto-update ----------
   The whole game is one file (index.html). When the game opens, or comes back from the background, it downloads
   a fresh copy of itself and reads the version written in it; if that is newer it reloads (never during a run).

  updBusy = true;

  var verRe = new RegExp('APP_' + 'VERSION = \'([0-9.-]+)\'');
  fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (txt) {
    var m = verRe.exec(txt), v = m ? { version: m[1] } : null;

    try { if (sessionStorage.getItem('cr-upd') === v.version) return; sessionStorage.setItem('cr-upd', v.version); } catch (e) {}
    toast('Updating to the newest version…', 1500);

      var both = !c.wreck && !d.wreck, mx = (c.x + d.x) / 2, my = (c.y + d.y) / 2;
      if (!c.wreck) { c.wreck = true; c.f = c.eff = 1; c.burn = 7; }
      if (!d.wreck) { d.wreck = true; d.f = d.eff = 1; d.burn = 7; }

    if (magnet > 0 && pullable && it.y > P.y - S.magRange && it.y < P.y + 30) it.x += (P.x - it.x) * Math.min(1, dt * 5);
    if (it.y > H + 60) { items.splice(i, 1); continue; }
    var scooped = S.scoop && it.type === 'crate' && Math.abs(it.x - P.x) < LANE_W * 1.25 && Math.abs(it.y - P.y) < (P.h + it.h) / 2 - 4;
    if (!scooped && !hit(P, it, it.type === 'oil' || it.type === 'pothole' ? 8 : 4)) continue;
    if (it.type === 'rock') {

    } else if (it.type === 'barrel') {

      explode(it.x, it.y, 1.1, true);
      if (S.plating) pop(P.x, P.y - 50, 'Plating held!', '#c9ccd4'); else if (nitro <= 0 && takeHit('Hit a barrel')) return;
    } else if (it.type === 'oil') {
      if (!it.used && !S.offroad) {
        it.used = true;
        if (S.grip < 0.8) { slip = 0.7 * (1 - S.grip); var dir = Math.random() < .5 ? -1 : 1; var nl2 = clamp(P.lane + dir, 0, LANES - 1); P.lane = nl2; pop(P.x, P.y - 50, 'Oil slick!', '#b8b8c8'); Aud.sfx('warn'); }
      }
    } else if (it.type === 'pothole') {
      if (!it.used) { it.used = true; if (!S.offroad && !S.plating) { shakeT = Math.max(shakeT, 0.45); fuel = Math.max(1, fuel - 5); pop(P.x, P.y - 50, 'Pothole -5 fuel', '#c8b8a8'); vibe(30); } }

    } else { collect(it); items.splice(i, 1); }
  }
  // player vs traffic
  for (i = traffic.length - 1; i >= 0; i--) {
    c = traffic[i];
    if (!hit(P, c)) continue;
    // on nitro you plough straight through traffic
    if (nitro > 0) {
      if (c.wreck) { traffic.splice(i, 1); burst(c.x, c.y, 20, '#ff8a3d', 200, 0.5, 3, 0); continue; }
      c.byPlayer = true; wreckCar(c, 0.8, true); var sg = cashGain(60); cash += sg; pop(c.x, c.y - 30, 'NITRO SMASH +$' + sg, '#37e4f0'); shakeT = Math.max(shakeT, 0.4);

function mapIcon(m, own) {

  if (m.weather === 'rain') { s += '<g stroke="rgba(210,225,255,.75)" stroke-width="1" stroke-linecap="round">'; for (var i = 0; i < 14; i++) { var x = (i * 17) % 60, y = 22 + (i * 23) % 46; s += '<path d="M' + x + ' ' + y + 'l-1.6 5"/>'; } s += '</g>'; }

  '1e6276e3bf587637b76fe4120c6fbbfe70e5e95bba42ad958fea055afa87e85b': { gold: true, key: 'GOLDEN' }

function sha256(msg) {

function redeem(raw) {

      c = carById(d('id'));
      if (!save.owned[c.id] && spend(c.price)) { save.owned[c.id] = 1; Gw(c.id); save.car = c.id; persist(); Aud.sfx('buy'); toast(c.name + ' is yours!'); rCars(); }

      }

appEl.addEventListener('click', function (e) {

  if (!el || el.disabled) return;

});
appEl.addEventListener('input', function (e) {
  if (e.target.classList && e.target.classList.contains('rng')) { SET()[e.target.getAttribute('data-k')] = parseInt(e.target.value, 10); Aud.init(); Aud.apply(); }
  if (e.target.id === 'gFind') { gFind = e.target.value; clearTimeout(rCars.t); rCars.t = setTimeout(function () { rCars(); rDetail(); }, 120); }
});
appEl.addEventListener('change', function (e) {

// PC: the mouse wheel scrolls sideways rows (filter chips, the car strip) that have no visible scrollbar
appEl.addEventListener('wheel', function (e) {
  var row = e.target.closest && e.target.closest('.chips, .cars');
  if (!row || !e.deltaY || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  if (row.scrollWidth <= row.clientWidth + 2 || getComputedStyle(row).display === 'grid') return;
  row.scrollLeft += e.deltaY; e.preventDefault();
}, { passive: false });
appEl.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  if (cur === 'name') { e.preventDefault(); doName(); }
  else if (cur === 'codes') { e.preventDefault(); doRedeem(); }
});
window.addEventListener('keydown', function (e) {
  var tg = e.target && e.target.tagName;
  if (tg === 'INPUT') return;
  if (e.key === 'Escape' && cur && ['garage', 'maps', 'jobs', 'codes', 'board', 'police'].indexOf(cur) >= 0) { show('menu'); e.preventDefault(); }
  else if (e.key === 'Escape' && cur === 'name' && nameBack) { var nb = nameBack; nameBack = null; show(nb); e.preventDefault(); }
  else if (e.key === 'Escape' && cur === 'settings') { if (setBack === 'pause') { cur = 'pause'; for (var k in OV) OV[k].hidden = k !== 'pause'; rPause(); } else show('menu'); e.preventDefault(); }
  // Enter starts a run from the menu, but not when a button has focus (the button's own click handles that)
  else if (e.key === 'Enter' && tg !== 'BUTTON' && (cur === 'menu' || cur === 'over')) { e.preventDefault(); if (cur === 'menu') mode = 'cargo'; hideAll(); startRun(); }
  else if (cur === 'garage' && tg !== 'SELECT' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { gStep(e.key === 'ArrowRight' ? 1 : -1); e.preventDefault(); }
  else if (cur === 'help' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { helpPage = clamp(helpPage + (e.key === 'ArrowRight' ? 1 : -1), 0, HELP.length - 1); rHelp(); e.preventDefault(); }
  else if (e.key === 'Escape' && cur === 'help') { show('menu'); e.preventDefault(); }
});

OV.settings.addEventListener('click', function (e) {

/* ---------- boot ---------- */
function boot() {

  gView = save.car;

  } else persist();
  show(save.name ? 'menu' : 'name');
  // put players' existing best run on the online leaderboard, and retry any score that didn't send last time
  if (save.name && save.best > (save.lbBest || 0) && !save.lbQueue) {
    save.lbQueue = { name: save.name.slice(0, 12), score: Math.min(LB_MAX, save.best), car: carById(save.car).name.slice(0, 24), map: mapById(save.map).name.slice(0, 24) };
    persist();

/* ---------- 3D view ----------

var BODY3D = { hatch: 'hatch', sedan: 'sedan', wagon: 'suv', coupe: 'sports', roadster: 'sports', muscle: 'muscle', sports: 'sports', super: 'super', suv: 'suv', offroad: 'suv', pickup: 'pickup', van: 'van', limo: 'sedan', classic: 'muscle', ev: 'sedan', rallyx: 'hatch', hyper: 'super', truck: 'truck', bus: 'bus', semi: 'semi' };

    return { type: BODY3D[pc.body] || 'sedan', col: pc.color, name: pc.name, top: 44 + (pc.pace || 0) * 18, handle: Math.max(6, Math.min(12, 5 + pc.agility * 0.22)), lives: pc.lives, pace: pc.pace || 0, look: {} };

  return { id: c.id, body: c.body, type: t, cyber: t === 'cyber', col: lk.paint || c.base || '#c8202f', name: c.name,
    top: topSpeed(c), handle: Math.max(5, Math.min(12, 5 + st.agility * 0.22)), lives: st.lives,
    look: { spoiler: lk.spoiler ? 'wing' : 'none', glow: lk.glow || 'none', tint: lk.tint ? 'dark' : 'normal', rims: lk.chrome ? 'silver' : lk.trim ? 'gold' : 'silver' } };
}
var run3D = null;
function open3D(cfg) {
  if (document.getElementById('cr3frame')) return;
  var src = document.getElementById('cr3src');
  if (!src) { toast('3D couldn’t load. Driving in 2D.', 2400); return false; }
  if (Aud.ctx && Aud.ctx.state === 'running') Aud.ctx.suspend();
  run3D = cfg;
  var f = document.createElement('iframe'); f.id = 'cr3frame'; f.name = 'cr3-embedded'; f.title = 'Cargo Run 3D'; f.allow = 'autoplay; fullscreen';
  f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483000;background:#0b0e1c';
  f.srcdoc = src.textContent.replace(/<\\\/script/g, '</script');
  // give the 3D game the keyboard straight away, so the arrow keys steer without clicking first
  f.onload = function () { try { f.focus(); f.contentWindow.focus(); } catch (err) {} };

  return true;
}
// traffic in 3D: a different mix of the game's own everyday cars every drive (plus the odd supercar)
var TRAFFIC_KIND = { sedan: 'sedan', classic: 'sedan', wagon: 'sedan', hatch: 'hatch', kei: 'hatch', suv: 'suv', box: 'suv', mpv: 'van', van: 'van', pickup: 'pickup',
  fast: 'sports', coupe: 'sports', roadster: 'sports', muscle: 'muscle', mid: 'super', hyper: 'super' };
function trafficDesigns() {

  for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = pool[i]; pool[i] = pool[j]; pool[j] = x; }
  pool.forEach(function (c) { var k = TRAFFIC_KIND[c.body.base]; if (out.length < max && (n[k] = (n[k] || 0) + 1) <= (k === 'super' ? 2 : 4)) out.push({ k: k, body: c.body }); });
  return out;
}
function start3D() {

  var m = mapById(save.map), mult = (m.cash || 1) * (mode === 'police' ? 1 : statsFor(save.car).pay);
  return open3D({ mode: mode, lvl: chaseLvl, place: save.map, car: car3D(), traffic: trafficDesigns(), mult: mult, quality: SET().quality || 'high' });
}
function close3D() { var f = document.getElementById('cr3frame'); if (f) f.remove(); run3D = null; if (Aud.ctx) Aud.ctx.resume(); }
// the 3D run is over: bank it exactly like a 2D run (wallet, best, stats, jobs, leaderboard, police record)
function done3D(r) {
  close3D();
  mode = r.mode === 'police' ? 'police' : 'cargo';
  prepare();
  if (mode === 'police') {
    S = policeStats(pcById(save.police.car)); reset(); chase = newChase();
    chase.busts = r.busts | 0; chase.total = r.bounty || 0;
    save.police.caught[chaseLvl] += r.busts | 0; save.police.busts += r.busts | 0;
    if (r.busts && chaseLvl < WANTED.length - 1 && save.police.caught[chaseLvl] === (r.busts | 0)) toast(WANTED[chaseLvl + 1].name + ' unlocked on the Wanted board!', 2600);
  } else chase = null;
  cash = Math.max(0, r.cash || 0); dist = Math.max(0, (r.km || 0) * 1000);
  run.deliv = r.deliv | 0; run.crates = r.crates | 0; run.booms = r.booms | 0;

}
// while 3D is open, keys that land on this page go to the 3D game instead of the 2D one underneath
window.addEventListener('keydown', function (e) {
  var f = document.getElementById('cr3frame'); if (!f) return;
  e.preventDefault(); e.stopImmediatePropagation();
  try { f.contentWindow.postMessage({ cr3key: e.key }, '*'); f.contentWindow.focus(); } catch (err) {}
}, true);
window.addEventListener('message', function (e) {
  var f = document.getElementById('cr3frame'), d = e.data;
  if (!f || !d) return;
  if (d === 'cr3-ready' && run3D) f.contentWindow.postMessage({ cr3run: run3D }, '*');
  else if (d.cr3done) done3D(d.cr3done);
  else if (d === 'cr3-exit') { close3D(); show('menu'); render('menu'); }
});
boot();
// developer test hooks: only exist when the page is opened with ?crtest in the address
if (window.__CR_TEST || /[?&]crtest\b/.test(location.search)) window.__CR = {
  drawCar: function (canvas, id, look) { preview(canvas, carById(id), 4.2, look || {}); },
  side: function (canvas, id, look, fill) { sidePreview(canvas, carById(id), look || {}, fill); }, cars: function () { return CARS_BY_PRICE.map(function (c) { return c.id; }); },
  car: function (id) { return carById(id); }, car3D: function () { return car3D(); },
  // a full-screen sheet of side views (ids, or a page of the price list) for checking every design by eye
  sheet: function (ids, cols, top) {
    var old = document.getElementById('crSheet'); if (old) old.remove(); if (!ids) return;
    if (typeof ids === 'number') { var all = CARS_BY_PRICE.map(function (c) { return c.id; }); ids = all.slice(ids * cols * cols, (ids + 1) * cols * cols); }
    var d = document.createElement('div'), rows = Math.ceil(ids.length / cols); d.id = 'crSheet';
    d.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#1a2036;display:grid;grid-template-columns:repeat(' + cols + ',1fr)';
    ids.forEach(function (id) {
      var w = document.createElement('div'), c = document.createElement('canvas'), l = document.createElement('span'), car = carById(id);
      w.style.cssText = 'position:relative;border:1px solid #333a55'; c.width = Math.floor(innerWidth / cols) * 2; c.height = Math.floor(innerHeight / rows) * 2;
      c.style.cssText = 'width:100%;height:' + Math.floor(innerHeight / rows - 2) + 'px;display:block';
      l.textContent = car.name; l.style.cssText = 'position:absolute;left:3px;top:1px;font:11px sans-serif;color:#cfd3e0';
      w.appendChild(c); w.appendChild(l); d.appendChild(w);
      if (top) { var g = c.getContext('2d'), k = Math.min(c.height * 0.8 / car.h, c.width * 0.5 / car.w); g.setTransform(0, k, -k, 0, c.width / 2, c.height / 2); drawCarFull(g, car, 0, 0, {}); }

  },
  save: function () { return save; }, persist: persist, show: show, start: function () { mode = 'cargo'; startRun(); }, prepare: prepare,
  st: function () { return { state: state, cash: cash, t: t, traffic: traffic.length, booms: run.booms, lives: lives, fuel: fuel, parts: parts.length, W: W, H: H,
    chase: chase ? { gap: Math.round(chase.gap), time: chase.time, busts: chase.busts, total: chase.total, hp: chase.sus ? chase.sus.hp : null, lane: chase.sus ? chase.sus.lane : null, pl: P.lane, why: chase.why, items: items.map(function (i) { return i.type; }).join(',') } : null }; },
  step: function () { if (state === 'count') countT = 0; if (state === 'paused') state = 'play'; update(1 / 60); },

  lanesCut: function () { return traffic.filter(function (c) { return c.pend != null; }).length; },
  chase: function (lvl) { mode = 'police'; chaseLvl = lvl || 0; hideAll(); startRun(); },
