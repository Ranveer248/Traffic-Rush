<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --page: #0b0e1a; --ink: #fff7e6; --dim: #b8b2c9; --accent: #ffc21a; --accent-dk: #d98a00; --accent-ink: #2a1800; --good: #4ce38f;
  --panel: #1a1f36; --panel2: #232a47; --edge: #070912; --line: rgba(255,255,255,0.1);
  --disp: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Avenir Next", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0b0e1a; } }
:root[data-theme="dark"] { --page: #0b0e1a; }
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); overscroll-behavior: none; }
body {
  margin: 0; height: 100%; background: var(--page); color: var(--ink); overflow: hidden; font-family: var(--body); font-weight: 800;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none;
  -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
input { -webkit-user-select: text; user-select: text; }
#app { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #0d1020; }
#c { display: block; touch-action: none; }
#pauseBtn {
  position: absolute; top: 12px; right: 12px; width: 50px; height: 50px; border-radius: 16px; z-index: 5; cursor: pointer;
  background: var(--panel); color: var(--ink); border: 3px solid var(--edge); box-shadow: 0 4px 0 var(--edge); font: 20px/1 var(--disp); letter-spacing: 3px;
}
#pauseBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
#pauseBtn[hidden] { display: none; }
#pauseBtn::before { content: ''; position: absolute; inset: -8px; }   /* (a slightly bigger tap area) */
#app:has(> #pauseBtn:not([hidden])) { touch-action: none; }   /* while driving: no browser zoom or scroll gestures, even beside the road */
.ov {
  position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 16px 14px 30px; animation: fade .2s ease;
  background: repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 14px, rgba(0,0,0,0) 14px 28px), rgba(9,11,22,0.72);
}
.ov[hidden] { display: none; }
/* centre these cards with auto margins, not justify-content, so a card taller than the screen can still scroll to its top */
#sc-name > *, #sc-menu > *, #sc-pause > *, #sc-over > *, #sc-help > *, #sc-daily > .card { margin-top: auto; margin-bottom: auto; }
#sc-garage, #sc-maps, #sc-jobs, #sc-codes, #sc-board, #sc-settings, #sc-police, #sc-achieve { background: repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0 14px, rgba(0,0,0,0) 14px 28px), #0e1224; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: translateY(14px) scale(.96); opacity: 0; } 70% { transform: translateY(-2px) scale(1.01); opacity: 1; } 100% { transform: none; } }
@keyframes wob { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(-2deg) scale(1.03); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }
.card { width: 100%; max-width: 420px; background: var(--panel); border: 3px solid var(--edge); border-radius: 22px; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 8px 0 var(--edge), 0 22px 50px rgba(0,0,0,0.45); animation: pop .3s ease; flex-shrink: 0; }
.card.center { text-align: center; align-items: stretch; }
.card.wide { max-width: 760px; }
.card.flat { background: transparent; border: 0; box-shadow: none; padding: 6px 2px; animation: none; }
.logo { display: flex; justify-content: center; align-items: center; gap: 6px; font-family: var(--disp); font-weight: 400; line-height: 1; font-size: clamp(38px, 11vw, 62px); transform: rotate(-4deg); animation: wob 3s ease-in-out infinite; margin: 4px 0 2px; }
.logo span { color: #fff; -webkit-text-stroke: 3px var(--edge); paint-order: stroke fill; text-shadow: 0 6px 0 var(--edge); }
.logo b { color: var(--accent-ink); background: var(--accent); padding: 2px 12px 6px; border: 3px solid var(--edge); border-radius: 14px; box-shadow: 0 6px 0 var(--edge); font-weight: 400; transform: rotate(3deg); display: inline-block; }
.ttl { margin: 0; font-family: var(--disp); font-weight: 400; font-size: clamp(40px, 11vw, 58px); line-height: 1; color: #fff; -webkit-text-stroke: 3px var(--edge); paint-order: stroke fill; text-shadow: 0 5px 0 var(--edge); }
.sub { margin: 0; color: var(--dim); font-size: 16px; line-height: 1.4; }
.sub b { color: var(--accent); }
.fine { margin: 0; color: #8e89a3; font-size: 13px; line-height: 1.4; font-weight: 700; }
.fine.pad { padding: 0 4px; }
.msg { margin: 0; min-height: 18px; color: #ff7a8a; font-size: 14px; }
.nb { margin: 0; color: var(--accent); font-family: var(--disp); font-size: 24px; animation: pulse 1s ease-in-out infinite; }
.fld { display: flex; flex-direction: column; gap: 5px; text-align: left; font-size: 14px; color: var(--dim); }
.fld input { font: 800 21px var(--body); padding: 12px 14px; border-radius: 14px; border: 3px solid var(--edge); background: #0f1325; color: var(--ink); width: 100%; outline: none; box-shadow: inset 0 3px 0 rgba(0,0,0,0.35); }
.fld input:focus { border-color: var(--accent); }
.btn {
  font: 20px/1.1 var(--disp); letter-spacing: .03em; padding: 12px 20px; min-height: 50px; background: var(--accent); color: var(--accent-ink);
  border: 3px solid var(--edge); border-radius: 16px; cursor: pointer; white-space: nowrap; position: relative;
  box-shadow: inset 0 -5px 0 rgba(0,0,0,0.2), inset 0 3px 0 rgba(255,255,255,0.35), 0 5px 0 var(--edge); transition: transform .06s, filter .12s;
}
.btn.big { font-size: 30px; padding: 16px 24px; min-height: 66px; border-radius: 20px; }
.btn.sm { font-size: 16px; padding: 7px 13px; min-height: 40px; border-radius: 12px; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2), 0 3px 0 var(--edge); }
.btn.ghost { background: var(--panel2); color: var(--ink); }
.btn.wide { width: 100%; }

/* how to play */
.htp { max-width: 440px; }
.htp canvas { width: 100%; height: auto; aspect-ratio: 300 / 190; border-radius: 16px; border: 3px solid var(--edge); background: #1b2033; display: block; }

.dot.on { background: var(--accent); transform: scale(1.25); }
.htpNav { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.confetti { position: absolute; top: -20px; width: 10px; height: 14px; z-index: 40; pointer-events: none; animation: fall 1.8s ease-in forwards; border-radius: 2px; }
#toast { position: absolute; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--panel); border: 3px solid var(--edge); color: var(--ink); padding: 12px 18px; border-radius: 16px;

.frStats b { font-size: 15px; color: var(--tr-green, #4ce38f); }
.frDim { font-size: 12px; font-weight: 700; color: var(--tr-dim, #b8b2c9); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frVs { font-size: 12px; font-weight: 900; }
.frVs.up { color: var(--tr-red, #ff4f5e); } .frVs.dn { color: var(--tr-green, #4ce38f); }
.frBtns { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.frInv { justify-content: center; margin-bottom: 6px; }
.board li { position: relative; }
.board li .frPlus { position: absolute; right: 10px; bottom: 8px; width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid var(--tr-blue, #3d9be9); background: var(--tr-night, #0b0e1a); color: var(--tr-blue, #3d9be9); font: 900 18px/1 system-ui, sans-serif; cursor: pointer; }
.board li:has(.frPlus) .mt { padding-right: 34px; }
.welcome a { color: var(--tr-yellow, #ffc21a); }
#invBar { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -160%); z-index: 9500; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-radius: 18px; background: var(--tr-panel, #1a1f36); border: 3px solid var(--tr-yellow, #ffc21a); box-shadow: 0 10px 30px rgba(0,0,0,.5); color: #fff; font-weight: 800; max-width: calc(100vw - 24px); transition: transform .35s cubic-bezier(.2,1.3,.4,1); }
#invBar.on { transform: translate(-50%, 0); }
#invBar b { color: var(--tr-yellow, #ffc21a); }
#sc-maps .maplist { grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px; }
#sc-maps .mr { flex-direction: column; align-items: stretch; gap: 8px; padding: 6px 6px 10px; border-radius: 18px; background: linear-gradient(180deg, var(--tr-raised, #232a47), var(--tr-panel, #1a1f36)); transition: transform .15s; }
#sc-maps .mr:active { transform: scale(.98); }
#sc-maps .msw { position: relative; width: 100%; height: auto; aspect-ratio: 60 / 48; border-radius: 13px; }
#sc-maps .mtx { padding: 0 4px; }
#sc-maps .mtx b { font-size: 17px; line-height: 1.1; }
#sc-maps .mtx span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#sc-maps .mr > .btn { margin: 0 4px; }
#sc-maps .mpay, #sc-maps .mnow { position: absolute; top: 6px; padding: 3px 8px; border-radius: 999px; font: 900 11px system-ui, sans-serif; letter-spacing: .03em; border: 2px solid var(--tr-edge, #070912); }
#sc-maps .mpay { right: 6px; background: var(--tr-green, #4ce38f); color: #08240f; }
#sc-maps .mnow { left: 6px; background: var(--tr-yellow, #ffc21a); color: var(--tr-on, #2a1800); }
</style>
