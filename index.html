<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --page: #0b0e1a; --ink: #fff7e6; --dim: #b8b2c9; --accent: #ffc21a; --accent-dk: #d98a00; --accent-ink: #2a1800; --good: #4ce38f;
  --panel: #1a1f36; --panel2: #232a47; --edge: #070912; --line: rgba(255,255,255,0.1);
  --disp: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Avenir Next", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0b0e1a; } }
:root[data-theme="dark"] { --page: #0b0e1a; }
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); overscroll-behavior: none; }
body {
  margin: 0; height: 100%; background: var(--page); color: var(--ink); overflow: hidden; font-family: var(--body); font-weight: 800;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none;
  -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
input { -webkit-user-select: text; user-select: text; }
#app { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #0d1020; }
#c { display: block; touch-action: none; }
#pauseBtn {
  position: absolute; top: 12px; right: 12px; width: 50px; height: 50px; border-radius: 16px; z-index: 5; cursor: pointer;
  background: var(--panel); color: var(--ink); border: 3px solid var(--edge); box-shadow: 0 4px 0 var(--edge); font: 20px/1 var(--disp); letter-spacing: 3px;
}
#pauseBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
#pauseBtn[hidden] { display: none; }
#pauseBtn::before { content: ''; position: absolute; inset: -8px; }   /* (a slightly bigger tap area) */
#app:has(> #pauseBtn:not([hidden])) { touch-action: none; }   /* while driving: no browser zoom or scroll gestures, even beside the road */
.ov {
  position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 16px 14px 30px; animation: fade .2s ease;
  background: repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 14px, rgba(0,0,0,0) 14px 28px), rgba(9,11,22,0.72);
}
.ov[hidden] { display: none; }
/* centre these cards with auto margins, not justify-content, so a card taller than the screen can still scroll to its top */
#sc-name > *, #sc-menu > *, #sc-pause > *, #sc-over > *, #sc-help > *, #sc-daily > .card { margin-top: auto; margin-bottom: auto; }
#sc-garage, #sc-maps, #sc-jobs, #sc-codes, #sc-board, #sc-settings, #sc-police, #sc-achieve { background: repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0 14px, rgba(0,0,0,0) 14px 28px), #0e1224; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: translateY(14px) scale(.96); opacity: 0; } 70% { transform: translateY(-2px) scale(1.01); opacity: 1; } 100% { transform: none; } }
@keyframes wob { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(-2deg) scale(1.03); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }
.card { width: 100%; max-width: 420px; background: var(--panel); border: 3px solid var(--edge); border-radius: 22px; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 8px 0 var(--edge), 0 22px 50px rgba(0,0,0,0.45); animation: pop .3s ease; flex-shrink: 0; }
.card.center { text-align: center; align-items: stretch; }
.card.wide { max-width: 760px; }
.card.flat { background: transparent; border: 0; box-shadow: none; padding: 6px 2px; animation: none; }
.logo { display: flex; justify-content: center; align-items: center; gap: 6px; font-family: var(--disp); font-weight: 400; line-height: 1; font-size: clamp(38px, 11vw, 62px); transform: rotate(-4deg); animation: wob 3s ease-in-out infinite; margin: 4px 0 2px; }
.logo span { color: #fff; -webkit-text-stroke: 3px var(--edge); paint-order: stroke fill; text-shadow: 0 6px 0 var(--edge); }
.logo b { color: var(--accent-ink); background: var(--accent); padding: 2px 12px 6px; border: 3px solid var(--edge); border-radius: 14px; box-shadow: 0 6px 0 var(--edge); font-weight: 400; transform: rotate(3deg); display: inline-block; }
.ttl { margin: 0; font-family: var(--disp); font-weight: 400; font-size: clamp(40px, 11vw, 58px); line-height: 1; color: #fff; -webkit-text-stroke: 3px var(--edge); paint-order: stroke fill; text-shadow: 0 5px 0 var(--edge); }
.sub { margin: 0; color: var(--dim); font-size: 16px; line-height: 1.4; }
.sub b { color: var(--accent); }
.fine { margin: 0; color: #8e89a3; font-size: 13px; line-height: 1.4; font-weight: 700; }
.fine.pad { padding: 0 4px; }
.msg { margin: 0; min-height: 18px; color: #ff7a8a; font-size: 14px; }

ol.board li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel); border: 3px solid var(--edge); border-radius: 14px; box-shadow: 0 3px 0 var(--edge); }
ol.board li.me { border-color: var(--accent); box-shadow: 0 3px 0 var(--accent-dk); }

.switch i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
.switch.on { background: var(--good); } .switch.on i { left: 27px; }
.rng { width: 46%; accent-color: var(--accent); }
.badge { font: 13px var(--body); font-weight: 900; background: #fff; color: #c2410c; border-radius: 999px; padding: 1px 7px; margin-left: auto; }
.job { display: flex; align-items: center; gap: 12px; padding: 12px; border: 3px solid var(--edge); border-radius: 16px; background: var(--panel); margin-bottom: 10px; box-shadow: 0 4px 0 var(--edge); }
.job.on { border-color: #ff7a2f; box-shadow: 0 4px 0 #a8430f; }

.jtx small { color: var(--dim); font-size: 12px; } .jtx b { font-size: 17px; color: #fff; }
.jr { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; } .jr em { font-style: normal; color: var(--accent); font-family: var(--disp); font-size: 22px; }
.jbar { height: 8px; border-radius: 4px; background: #0e1224; border: 1.5px solid var(--edge); overflow: hidden; margin-top: 4px; } .jbar u { display: block; height: 100%; background: var(--accent); }
.jdone { display: flex; flex-direction: column; gap: 6px; } .jdone div { display: flex; justify-content: space-between; gap: 10px; background: #2b2412; border: 2px solid var(--edge); border-radius: 12px; padding: 8px 10px; font-size: 14px; text-align: left; }
.jdone b { color: var(--accent); white-space: nowrap; font-family: var(--disp); font-weight: 400; font-size: 17px; }
/* how to play */
.htp { max-width: 440px; }
.htp canvas { width: 100%; height: auto; aspect-ratio: 300 / 190; border-radius: 16px; border: 3px solid var(--edge); background: #1b2033; display: block; }
.htp .step { font: 14px var(--disp); color: var(--accent); letter-spacing: .08em; }
.htp h3 { margin: 0; font-family: var(--disp); font-weight: 400; font-size: 36px; line-height: 1; color: #fff; -webkit-text-stroke: 2px var(--edge); paint-order: stroke fill; text-shadow: 0 4px 0 var(--edge); }
.htp p { margin: 0; color: var(--dim); font-size: 17px; line-height: 1.4; min-height: 48px; }
.dots { display: flex; justify-content: center; gap: 8px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--edge); background: #3a4060; padding: 0; cursor: pointer; }
.dot.on { background: var(--accent); transform: scale(1.25); }
.htpNav { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.confetti { position: absolute; top: -20px; width: 10px; height: 14px; z-index: 40; pointer-events: none; animation: fall 1.8s ease-in forwards; border-radius: 2px; }
#toast { position: absolute; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--panel); border: 3px solid var(--edge); color: var(--ink); padding: 12px 18px; border-radius: 16px;
  font: 18px var(--disp); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; max-width: 90%; text-align: center; box-shadow: 0 5px 0 var(--edge); }

@media (min-width: 760px) {
  .ov { padding: 26px 26px 36px; }

  .htp { max-width: 520px; }
  .maplist { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
}
/* side-by-side garage only when there is room both ways (tablets and PCs, not phones on their side) */
@media (min-width: 760px) and (min-height: 600px) {
  .gwrap { display: grid; grid-template-columns: minmax(0, 1fr) 380px; align-items: start; gap: 18px; flex: 1; min-height: 0; }
  .gleft { display: flex; flex-direction: column; min-height: 0; max-height: calc(100vh - 130px); max-height: calc(100dvh - 130px); }
  .cars { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); overflow-y: auto; overflow-x: hidden; align-content: start; padding: 2px 6px 10px 2px; }
  .cc { flex: none; } .cc canvas { width: 88px; height: 44px; }
  .gright { position: sticky; top: 0; max-height: calc(100vh - 130px); max-height: calc(100dvh - 130px); overflow-y: auto; }
  .det canvas { width: 150px; height: 158px; }
  #sc-garage { overflow: hidden; }
}
/* big screens: wrap the car-type filters instead of scrolling them */
@media (min-width: 1100px) and (min-height: 600px) { .gwrap { grid-template-columns: minmax(0, 1fr) 440px; } .gleft .chips { flex-wrap: wrap; overflow: visible; } }
@media (min-width: 1300px) and (min-height: 600px) { .gwrap { grid-template-columns: minmax(0, 1fr) 460px; } }
/* shorter screens (laptops, tablets on their side): tighter cards */
@media (max-height: 820px) { .ov { padding-top: 14px; padding-bottom: 14px; } .card { gap: 8px; } .logo { font-size: clamp(34px, 7vh, 54px); } .ride canvas { height: 96px; } .btn.big { min-height: 58px; font-size: 26px; padding: 12px 20px; } }
@media (max-height: 600px) and (orientation: landscape) { .card { padding: 14px 16px; gap: 8px; } .logo { font-size: 40px; } .btn.big { min-height: 52px; font-size: 24px; padding: 10px; } .ride canvas { height: 76px; } .htp canvas { max-height: 150px; } }
/* phones on their side: two-column main menu so it fits without scrolling */
@media (max-height: 560px) and (orientation: landscape) and (min-width: 600px) {
  .menuCard { max-width: 800px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 16px; row-gap: 8px; align-items: start; }
  .menuCard > .topline { grid-column: 1 / -1; }
  .menuCard > .logo { grid-column: 1; grid-row: 2; font-size: 36px; margin: 0; }
  .menuCard > .ride { grid-column: 1; grid-row: 3; }
  .menuCard > .gift { grid-column: 1; grid-row: 4; }
  .menuCard > .gift.dch { grid-column: 2; grid-row: 5; }
  .menuCard > .mini { grid-column: 1; grid-row: 5; }
  .menuCard > .wkbar, .menuCard > .sndask { grid-column: 1 / -1; }
  .menuCard > .pbtn { grid-column: 1; grid-row: 6; }
  .menuCard > .btn.big { grid-column: 2; grid-row: 2; }
  .menuCard > .grid2 { grid-column: 2; grid-row: 3 / span 2; gap: 8px; }
  .menuCard > .row2 { grid-column: 2; grid-row: 6; }
  .ov { padding: 10px 14px 14px; }
  .menuCard { padding: 10px 14px 12px; }
  .menuCard .mbtn { min-height: 44px; }
  .ride { padding: 4px 10px 8px; } .ride canvas { height: 70px; width: 100%; } .rideTx b { font-size: 24px; } .rideTx em { font-size: 20px; }
  .gift { padding: 6px 12px; } .gift svg { width: 30px; height: 30px; } .gift .streak { display: none; }
}
/* ---- menu polish (October 2026): every size ---- */
.menuCard > .topline, .menuCard > .logo, .menuCard > .ride { order: -2; }
.menuCard > .btn.big { order: -1; }
.menuCard { background: radial-gradient(120% 60% at 50% 0%, rgba(120, 150, 255, 0.10), rgba(120, 150, 255, 0) 60%), var(--panel); }
.menuCard > .grid2 { grid-auto-rows: 1fr; }
.menuCard .mbtn { min-height: 54px; position: relative; isolation: isolate; }
.menuCard .mbtn::after { content: ''; position: absolute; left: 3px; right: 3px; top: 3px; height: 42%; border-radius: 11px 11px 6px 6px; background: linear-gradient(rgba(255,255,255,0.22), rgba(255,255,255,0)); pointer-events: none; z-index: -1; }
.menuCard .mbtn .badge { margin-left: auto; }
.menuCard > .btn.big { position: relative; }
@media (prefers-reduced-motion: no-preference) {
  .menuCard > .btn.big[data-act="play"] { animation: playGlow 2.4s ease-in-out infinite; }
  @keyframes playGlow { 0%, 100% { box-shadow: 0 6px 0 var(--edge), 0 0 0 0 rgba(255, 210, 63, 0); } 50% { box-shadow: 0 6px 0 var(--edge), 0 0 22px 2px rgba(255, 210, 63, 0.45); } }
}
.menuCard > .mini div { background: linear-gradient(#151a36, #0e1228); }
/* phones held sideways: three columns, so nothing has to scroll far */
@media (max-height: 560px) and (orientation: landscape) and (min-width: 600px) {
  .menuCard { max-width: 940px; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.25fr); }

  .menuCard .mbtn { min-height: 42px; font-size: 15px; padding: 7px 8px; }

/* tablets, laptops and PCs: two balanced panels. Left: the showroom (your car, stats). Right: Play, today's cards and every menu button. */
@media (min-width: 900px) and (min-height: 600px) {
  #sc-menu > .menuCard { max-width: 980px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); grid-auto-flow: row dense; column-gap: 22px; row-gap: 10px; align-items: start; }
  #sc-menu > .menuCard > * { grid-column: 1; min-width: 0; }
  #sc-menu > .menuCard > .topline { grid-column: 1 / -1; grid-row: 1; }
  #sc-menu > .menuCard > .logo { grid-row: 2; margin: 2px 0 4px; }

}
